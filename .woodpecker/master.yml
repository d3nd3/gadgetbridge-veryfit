steps:
  build:
    image: codeberg.org/freeyourgadget/android-fdroid-tools:36.0.0-androguard-4.1.2-java-21
    commands:
      - pwd #bump
      - ./gradlew assembleDebug --stacktrace

  lint:
    image: codeberg.org/freeyourgadget/android-fdroid-tools:36.0.0-androguard-4.1.2-java-21
    depends_on:
      - build
    failure: ignore
    commands:
      - ./gradlew lint || (touch .lint_failed && exit 1)

  tests:
    image: codeberg.org/freeyourgadget/android-fdroid-tools:36.0.0-androguard-4.1.2-java-21
    depends_on:
      - lint
    failure: ignore
    commands:
      - ./gradlew :app:testBangleDebugUnitTest :app:testMainDebugUnitTest || (touch .tests_failed && exit 1)

  check-failures:
    image: codeberg.org/freeyourgadget/android-fdroid-tools:36.0.0-androguard-4.1.2-java-21
    depends_on:
      - tests
    commands:
      - |
        if [ -f .lint_failed ] || [ -f .tests_failed ]; then
          echo "One or more steps failed:"
          [ -f .lint_failed ] && echo "  - lint failed"
          [ -f .tests_failed ] && echo "  - tests failed"
          exit 1
        fi
        echo "All checks passed!"

#when:
#repo: Freeyourgadget/Gadgetbridge
#branch: master
#this doesn't work yet:
#https://github.com/woodpecker-ci/woodpecker/issues/687

when:
  # Everything except cron (nightly) and deployment
  - event: push
  - event: pull_request
  - event: tag
  - event: manual
